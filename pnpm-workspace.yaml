# GHSA-r28c-9q8g-f849 — postcss path traversal, reached only via vite (build-time).
overrides:
  postcss: '>=8.5.18'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
# Don't re-run `pnpm install` before every `pnpm run <script>`.
verifyDepsBeforeRun: false
